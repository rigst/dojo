name: testes

on:
  push:
    branches: [main]
  pull_request:
  # Botão de reprovocação. Em 02/09/2026 um merge na main do sistema_vetorial
  # não gerou evento de push: zero check-runs no commit, logo nenhum CI e —
  # porque o CD pende de `workflow_run` — nenhum deploy. Um commit entrou na
  # main sem validação e o servidor ficou para trás, em silêncio. Sem isto a
  # única saída seria um commit vazio só para provocar o push de novo.
  # Serve também de redeploy manual quando o CD falha por motivo transitório.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # A suíte roda contra o dublê: nenhum teste do CI fala com a API da
      # Anthropic. Os que falam levam o marcador `ia_real` e ficam de fora.
      DOJO_IA_BACKEND: fake
      DJANGO_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Checagem do Django
        run: python manage.py check

      - name: Migrations sem pendência
        # Modelo alterado sem migration passa nos testes e quebra no deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: |
          python -m pytest -q -m "not ia_real and not e2e and not visual" \
            --cov --cov-report=xml:coverage.xml --cov-report=term-missing

      # O Sonar roda noutro job, com checkout limpo: sem passar o arquivo por
      # artefato ele não vê cobertura nenhuma e reprova tudo como descoberto.
      - name: Guardar a cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Navegador para os testes de ponta a ponta
        run: python -m playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        # Sobem o mesmo uvicorn do desenvolvimento contra um banco temporário.
        run: python -m pytest -q -m e2e

      # Os de comparação de tela (`-m visual`) não entram aqui: a renderização
      # de texto depende das fontes instaladas na máquina, e a referência
      # gravada no computador de quem desenvolve não bate com a do runner.
      # Eles são rodados à mão antes de commitar mudança de CSS.

      - name: Imports mortos
        run: |
          pip install pyflakes
          # As migrations são geradas e têm imports que o pyflakes reclama;
          # o `!` faz o passo falhar quando sobra qualquer outra coisa.
          ! pyflakes core usuarios projetos mentoria revisoes ia legal config \
            | grep -v "/migrations/" | grep .

  sonar:
    name: SonarQube Cloud
    needs: [pytest]
    # PR do Dependabot não recebe os secrets do repositório — restrição do
    # próprio GitHub Actions. Sem SONAR_TOKEN o scanner morre com "Not
    # authorized or project not found" e o X vermelho trava a triagem. Pular
    # nesses PRs vira um SKIPPED honesto. Ver rigst/ci RUNBOOK.md.
    if: always() && needs.pytest.result == 'success' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # O Sonar usa o blame do git para atribuir "código novo" — precisa do
      # histórico inteiro, senão toda linha vira responsabilidade do último commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar a cobertura do job de testes
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # `args` é escalar dobrado (>): tudo aqui dentro vira uma linha só
          # passada ao scanner, então comentário indentado aqui dentro chega
          # como argumento e o sonar-scanner morre com "Unrecognized option: #".
          #
          # O job de pytest acima não gera relatório de cobertura, e sem
          # relatório o Sonar marca toda linha nova como descoberta (0%) — o
          # Quality Gate reprova qualquer PR com código Python. Enquanto não
          # houver relatório, ao menos configuração fica de fora: `settings.py`
          # é a forma de arquivo do `**/settings/**` que os outros projetos já
          # excluem, e o glob de pacote não casa com settings em arquivo único.
          args: >
            -Dsonar.projectKey=rigst_dojo
            -Dsonar.organization=rigst
            -Dsonar.exclusions=**/migrations/**,**/staticfiles/**,**/node_modules/**,**/venv/**,**/.venv/**,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.ico,**/*.webp,**/*.pdf,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=**/migrations/**,**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,**/conftest.py,**/settings/**,**/settings.py,**/manage.py,**/wsgi.py,**/asgi.py,scripts/**
