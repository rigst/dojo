name: CD

on:
  workflow_run:
    # Casa pelo `name:` do workflow, não pelo nome do arquivo. O CI do dojo
    # passou de `testes` para `CI` ao migrar para o pipeline compartilhado;
    # deixar "testes" aqui faria o CD simplesmente nunca disparar, sem erro
    # nenhum — o mesmo silêncio do push perdido de 02/09.
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    uses: rigst/ci/.github/workflows/deploy-django.yml@d4f7242e23d61510fd8c964275f4cbd0ce55e419  # v1
    secrets:
      CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
    with:
      ssh-host: "dojo.stolben.com"
