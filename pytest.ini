[pytest]
# Settings únicos: o ambiente é escolhido por DJANGO_ENV, não por módulo.
DJANGO_SETTINGS_MODULE = config.settings

# O padrão do pytest é test_*.py, que não encontra nada aqui: a convenção do
# projeto é tests.py por app.
python_files = tests.py tests_*.py test_*.py

# Restringe a busca aos apps: scripts/ tem .py que não é teste.
testpaths = core usuarios projetos mentoria revisoes ia legal testes_navegador

# Os de navegador ficam de fora do `pytest` pelado: exigem o Chromium
# instalado e levam segundos, não milissegundos. Rode-os de propósito, com
# `pytest -m e2e` ou `pytest -m visual`.
addopts = --strict-markers -m "not ia_real and not e2e and not visual"

# Com --strict-markers, marcador não declarado é erro de coleta e não aviso,
# então esta lista é obrigatória, não documentação.
markers =
    ia_real: bate na API da Anthropic de verdade (exige chave; fora do padrão)
    e2e: navega no app de verdade com o Playwright (exige navegador; fora do padrão)
    visual: compara capturas de tela com as de referência (exige navegador; fora do padrão)
